<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Ktre Clothing</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #000000f1, #000000);
            color: #333;
        }
        header {
            background: linear-gradient(90deg, #000, #444);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
            letter-spacing: 1px;
        }
        header h1 {
            font-size: 42px;
            margin: 0;
            text-transform: uppercase;
        }
        header p {
            font-size: 18px;
            opacity: 0.8;
        }
        section {
            max-width: 900px;
            margin: 50px auto;
            background: #838383;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            animation: fadeIn 1s ease-in-out;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 32px;
            color: #111;
        }
        .contact-info p {
            font-size: 20px;
            margin: 12px 0;
        }
        .contact-info strong {
            color: #000;
        }
        .social-links a {
            margin-right: 20px;
            text-decoration: none;
            font-weight: 600;
            border: 2px solid #000;
            padding: 10px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .social-links a:hover {
            background: #000;
            color: #fff;
        }
        footer {
            margin-top: 50px;
            background: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <header>
        <h1>Ktre Clothing</h1>
        <p>Contact Us</p>
    </header>

    <section>
        <h2>We'd Love to Hear From You!</h2>
        <p>If you have any questions, suggestions, or business inquiries, feel free to reach out to us anytime.</p>

        <div class="contact-info">
            <p><strong>Email:</strong> Ktreclothing@gmail.com</p>
            <p><strong>Instagram:</strong> @KtreThrift</p>
        </div>

        <h3>Follow Us</h3>
        <div class="social-links">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
        </div>
    </section>

    <footer>
        <p>&copy; 2025 Ktre Clothing. All Rights Reserved.</p>
    </footer>
</body>
</html>
